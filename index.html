<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecSync — Semiconductor IP Specification & Register Compiler</title>
    <meta name="description" content="AI-assisted semiconductor specification compiler that converts hardware IP PDFs into a verified canonical register-map database, generates industry-standard outputs, and cross-checks against RTL and firmware headers." />
    <meta property="og:title" content="SpecSync — Semiconductor IP Specification & Register Compiler" />
    <meta property="og:description" content="AI-assisted semiconductor specification compiler that converts hardware IP PDFs into a verified canonical register-map database, generates industry-standard outputs, and cross-checks against RTL and firmware headers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-[#0B0F17] text-slate-900 dark:text-slate-100 antialiased selection:bg-sky-500/20 dark:selection:bg-sky-500/30 selection:text-sky-900 dark:selection:text-sky-200 transition-colors duration-150">
    <div id="root"></div>
    <script>
      window.__loadSpecSyncDistFallback = function () {
        if (window.__specSyncFallbackLoaded) return;
        var hasBuiltBundle = Array.prototype.some.call(document.scripts, function (s) {
          return s.src && s.src.indexOf('assets/specsync.js') !== -1 && s.src.indexOf('dist/assets/specsync.js') === -1;
        });
        if (hasBuiltBundle) return;
        window.__specSyncFallbackLoaded = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './dist/assets/specsync.css';
        document.head.appendChild(link);
        var script = document.createElement('script');
        script.type = 'module';
        script.src = './dist/assets/specsync.js';
        document.body.appendChild(script);
      };
    </script>
    <script
      type="module"
      src="./src/main.tsx"
      onerror="window.__loadSpecSyncDistFallback && window.__loadSpecSyncDistFallback()"
    ></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childNodes.length === 0) {
          window.__loadSpecSyncDistFallback();
        }
      }, 600);
    </script>
  </body>
</html>
